<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="robotBody" x1="20" y1="12" x2="78" y2="84" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffffff"></stop>
            <stop offset="0.38" stop-color="#b9d8ff"></stop>
            <stop offset="1" stop-color="#5a91ff"></stop>
        </linearGradient>

        <linearGradient id="robotScreen" x1="24" y1="28" x2="72" y2="68" gradientUnits="userSpaceOnUse">
            <stop stop-color="#14294a"></stop>
            <stop offset="1" stop-color="#050a13"></stop>
        </linearGradient>

        <radialGradient id="eyeGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(48 48) rotate(90) scale(28 35)">
            <stop stop-color="#8ec6ff" stop-opacity="0.95"></stop>
            <stop offset="0.55" stop-color="#5d9dff" stop-opacity="0.35"></stop>
            <stop offset="1" stop-color="#5d9dff" stop-opacity="0"></stop>
        </radialGradient>

        <filter id="softGlow" x="-20" y="-20" width="136" height="136" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
            <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.62 0 0 0 0 1 0 0 0 0.7 0"></feColorMatrix>
            <feBlend in="SourceGraphic" mode="normal"></feBlend>
        </filter>
    </defs>

    <circle cx="48" cy="48" r="42" fill="#07111f" stroke="#9ec8ff" stroke-opacity="0.32" stroke-width="2"></circle>

    <circle cx="48" cy="48" r="34" fill="url(#eyeGlow)" opacity="0.65"></circle>

    <path d="M48 15V23" stroke="#dbeaff" stroke-width="3" stroke-linecap="round"></path>

    <circle cx="48" cy="12" r="5" fill="#83b9ff" filter="url(#softGlow)"></circle>

    <rect x="19" y="24" width="58" height="54" rx="22" fill="url(#robotBody)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"></rect>

    <rect x="26" y="31" width="44" height="34" rx="15" fill="url(#robotScreen)" stroke="#9ec8ff" stroke-opacity="0.35" stroke-width="1.5"></rect>

    <circle cx="39" cy="47" r="4" fill="#9fd0ff" filter="url(#softGlow)"></circle>

    <circle cx="57" cy="47" r="4" fill="#9fd0ff" filter="url(#softGlow)"></circle>

    <path d="M41 57C44.5 60 51.5 60 55 57" stroke="#d8ecff" stroke-width="2.4" stroke-linecap="round"></path>

    <path d="M20 43H14C11.8 43 10 44.8 10 47V54C10 56.2 11.8 58 14 58H20" stroke="#9ec8ff" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round"></path>

